<title>agent-deck Anmeldung</title>

<body>
<p id="t">Du wirst zu agent-deck weitergeleitet. Falls nichts passiert: agent-deck muss laufen und auf die Anmeldung warten.</p>
<script>(function(){var q=location.search;if(q&&/^\?[A-Za-z0-9_.~%=&+\-]*$/.test(q)){location.replace("http://127.0.0.1:47913/callback"+q)}else{document.getElementById("t").textContent="Diese Adresse enthaelt keine gueltige Anmeldung. Bitte in agent-deck erneut versuchen."}})()</script>
</body>
